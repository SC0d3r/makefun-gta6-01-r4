<!doctype html>
<!-- Entry frames captured at 1280x720; the page is frozen for the r7 entry. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELA CITY</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1016;font:16px system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#f4ead6;z-index:10}
.overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(4,10,14,.78);text-align:center}
.overlay.show{display:grid}
.menu-btn{margin:6px;padding:12px 26px;border:2px solid #ffc35c;background:#102027;color:#f4ead6;font:700 18px system-ui;pointer-events:auto;cursor:pointer}
.menu-kicker,.menu-save,.menu-hint,.pause-hint,.dead-sub{color:#ffc35c;margin:8px}
#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body>
<canvas id="game" aria-label="VELA CITY open-world coast: chase, marina gunfight, dusk race, city map"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
